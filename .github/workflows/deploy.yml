name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: :write

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:

      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Rendre le script executable
        run: chmod +x test.sh

      - name: Executer les tests
        run: ./test.sh

deploy:
  name: Deploiement

  if: github.event_name == 'push'

  needs: test

  run-on: ubuntu-latest

  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}

  steps:

    - name: Recuperer le code
      uses: actions/checkout@v6

    - name: Configurer GitHub Pages
      uses:  actions/configure-pages@v5

    - name: Preparer le site
      uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - name: Depoyer
      id: deployement
      uses: actions/deploy-pages@v4
